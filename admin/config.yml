# Decap CMS 설정 — /admin 에서 GitHub 로그인으로 글을 작성합니다.
# ※ 로그인이 작동하려면 OAuth 연동(base_url)이 필요합니다.
#    연동 전까지는 README.md의 "웹에서 바로 글쓰기" 방법을 사용하세요.
backend:
  name: github
  repo: hpolicy/hcityatlas
  branch: main
  # OAuth 프록시를 만든 뒤 아래 주석을 해제하고 주소를 넣으세요:
  # base_url: https://<your-oauth-proxy>

media_folder: "assets/images/uploads"   # 업로드한 사진이 저장되는 폴더
public_folder: "/hcityatlas/assets/images/uploads"
# 커스텀 도메인(hcityatlas.org) 연결 후에는 public_folder를 "/assets/images/uploads" 로 바꾸세요.

locale: ko

collections:
  - name: "news"
    label: "소식"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "레이아웃", name: "layout", widget: "hidden", default: "post" }
      - { label: "제목", name: "title", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime" }
      - { label: "대표 사진", name: "image", widget: "image", required: false, hint: "글 상단에 크게 표시됩니다" }
      - { label: "본문", name: "body", widget: "markdown", hint: "본문 중간에도 사진을 넣을 수 있습니다" }
